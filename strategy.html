<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="canonical" href="https://coldbloodedtraders.com/strategy.html">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://coldbloodedtraders.com/assets/cbt-logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="https://coldbloodedtraders.com/assets/cbt-logo.png">
    <link rel="icon" type="image/png" href="assets/cbt-logo.png">
    <link rel="apple-touch-icon" href="assets/cbt-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Hub: Choose Your Trading Framework | ColdBloodedTraders</title>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="description" content="Explore ColdBloodedTraders Strategy Hub. Select your trading framework, master mathematical expectancy, liquidity hunting, or delta-neutral yield systems.">
    
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 34, 0.7);
            --accent-color: #00f2fe;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: rgba(240, 246, 252, 0.1);
            --color-foundation: #00e676;
            --color-core: #ff9800;
            --color-advanced: #e91e63;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; line-height: 1.8; margin: 0; padding: 0; }
        header { position: sticky; top: 0; backdrop-filter: blur(12px); background: rgba(11, 14, 20, 0.85); padding: 1.2rem 2rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .logo { font-weight: 800; color: var(--text-main); text-decoration: none; font-size: 1.2rem; }
        .logo-full span { color: var(--accent-color); }
        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .back-btn { color: var(--accent-color); text-decoration: none; font-weight: 600; font-size: 0.95rem; }
        
        .hub-container { max-width: 1000px; margin: 3rem auto 5rem auto; padding: 0 1.5rem; }
        .hub-header-meta { text-align: center; margin-bottom: 3rem; }
        
        /* Gradient Başlık Efekti */
        h1 { 
            font-size: 2.6rem; 
            margin: 0.5rem 0 1rem 0; 
            line-height: 1.25; 
            font-weight: 800; 
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-color) 60%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        .tag-strategy { color: var(--accent-color); font-weight: 700; font-size: 0.85rem; letter-spacing: 1.5px; text-transform: uppercase; }
        .meta { color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 2.5rem; }
        
        .strategy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .strategy-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.75rem; }
        /* Diğer stil kuralların aynı şekilde kalıyor */
    </style>
</head>
<body>
    <!-- Geri kalan body yapısı aynı kalmalı -->
</body>
</html>
