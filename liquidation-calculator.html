<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="canonical" href="https://coldbloodedtraders.com/liquidation-calculator.html">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidation Price Calculator | ColdBloodedTraders</title>
    <link rel="icon" type="image/png" href="assets/cbt-logo.png">
    
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 34, 0.7);
            --accent-color: #00f2fe;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: rgba(240, 246, 252, 0.1);
            --danger-color: #ff4d4d;
            --success-color: #00e676;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; }
        
        /* Header & Mobile Logo Consistency */
        header {
            position: sticky; top: 0; backdrop-filter: blur(12px); background: rgba(11, 14, 20, 0.85);
            padding: 1.2rem 2rem; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        .logo { font-weight: 800; color: var(--text-main); text-decoration: none; font-size: 1.2rem; }
        .logo-full span { color: var(--accent-color); }
        .logo-short { display: none; font-weight: 900; color: var(--text-main); }
        .logo-short span { color: var(--accent-color); }
        .nav-right { display: flex; align-items: center; gap: 1rem; }

        /* Dropdown Menu Consistency */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { color: var(--accent-color); background: transparent; font-weight: 700; border: 1px solid var(--accent-color); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; }
        .dropdown-content { display: none; position: absolute; right: 0; top: 120%; background-color: #161b22; min-width: 220px; border: 1px solid var(--border-color); border-radius: 8px; z-index: 1001; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .dropdown-content a { color: var(--text-main); padding: 0.75rem 1rem; text-decoration: none; display: block; font-size: 0.85rem; border-bottom: 1px solid rgba(240, 246, 252, 0.05); }
        .dropdown-content a:hover { background: rgba(0, 242, 254, 0.08); color: var(--accent-color); }
        .dropdown.active .dropdown-content { display: block; }

        .container { max-width: 820px; margin: 3rem auto 5rem auto; padding: 0 1.5rem; }
        
        /* Calculator Grid */
        .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 2rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input { width: 100%; background: #0b0e14; border: 1px solid var(--border-color); color: white; padding: 0.8rem; border-radius: 6px; }
        
        .type-btns { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .t-btn { flex: 1; padding: 0.6rem; background: #161b22; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 6px; cursor: pointer; font-weight: 700; }
        .t-btn.active-long { border-color: var(--success-color); color: var(--success-color); }
        .t-btn.active-short { border-color: var(--danger-color); color: var(--danger-color); }

        .results-panel { display: flex; flex-direction: column; justify-content: center; gap: 1.5rem; }
        .res-item .label { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
        .res-item .val { font-size: 1.6rem; font-weight: 800; color: var(--accent-color); }

        @media (max-width: 600px) {
            .logo-full { display: none; }
            .logo-short { display: inline-block; }
            .calc-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <span class="logo-full">COLDBLOODED<span>TRADERS</span></span>
            <span class="logo-short">CB<span>T</span></span>
        </a>
        <div class="nav-right">
            <div class="dropdown" id="toolsDropdown">
                <button class="dropdown-btn" onclick="toggleDropdown()">🧮 Tools &#9662;</button>
                <div class="dropdown-content">
                    <a href="calculator.html">Position Size Calculator</a>
                    <a href="liquidation-calculator.html">Liquidation Price Calculator</a>
                    <a href="risk-metrics.html">Risk Metrics Calculator</a>
                </div>
            </div>
            <a href="index.html" style="color:var(--accent-color); font-size:0.9rem; text-decoration:none;">&larr; Home</a>
        </div>
    </header>

    <main class="container">
        <h1>Liquidation Calculator</h1>
        <div class="calc-grid">
            <div class="inputs">
                <label>Position Direction</label>
                <div class="type-btns">
                    <button class="t-btn active-long" id="bL" onclick="setDir('LONG')">LONG</button>
                    <button class="t-btn" id="bS" onclick="setDir('SHORT')">SHORT</button>
                </div>
                <div class="form-group"><label>Entry Price</label><div class="input-wrapper"><input type="number" id="entry" value="65000"></div></div>
                <div class="form-group"><label>Leverage</label><div class="input-wrapper"><input type="number" id="lev" value="10"></div></div>
                <div class="form-group"><label>Maint. Margin %</label><div class="input-wrapper"><input type="number" id="mm" value="0.5"></div></div>
            </div>
            <div class="results-panel">
                <div class="res-item"><div class="label">Liq. Price</div><div class="val" id="rLiq">$0.00</div></div>
                <div class="res-item"><div class="label">Margin Requirement</div><div class="val" id="rMargin">0.00%</div></div>
            </div>
        </div>
    </main>

    <script>
        let dir = 'LONG';
        function toggleDropdown() { document.getElementById('toolsDropdown').classList.toggle('active'); }
        window.onclick = (e) => { if (!e.target.closest('.dropdown')) document.getElementById('toolsDropdown').classList.remove('active'); }
        
        function setDir(d) {
            dir = d;
            document.getElementById('bL').className = d == 'LONG' ? 't-btn active-long' : 't-btn';
            document.getElementById('bS').className = d == 'SHORT' ? 't-btn active-short' : 't-btn';
            calc();
        }

        function calc() {
            let e = parseFloat(document.getElementById('entry').value), l = parseFloat(document.getElementById('lev').value), m = parseFloat(document.getElementById('mm').value)/100;
            let imr = 1/l;
            let liq = dir == 'LONG' ? e * (1 - imr + m) : e * (1 + imr - m);
            document.getElementById('rLiq').textContent = `$${liq.toFixed(2)}`;
            document.getElementById('rMargin').textContent = `${(imr*100).toFixed(2)}%`;
        }
        document.querySelectorAll('input').forEach(i => i.addEventListener('input', calc));
    </script>
</body>
</html>
